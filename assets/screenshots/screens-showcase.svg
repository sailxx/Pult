<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Pult Landscape Dock Screens">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap');
text { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.phone{fill:#06070A;stroke:#222834;stroke-width:2}
.card{fill:#0C0E14;stroke:#1F2432;stroke-width:1}
.cardLight{fill:#141722;stroke:#1F2432;stroke-width:1}
.white{fill:#FFFFFF}
.sub{fill:#8B949E}
</style>
<defs>
<clipPath id="cHero"><rect x="230" y="25" width="740" height="340" rx="28"/></clipPath>
<clipPath id="cMedia"><rect x="40" y="420" width="545" height="270" rx="24"/></clipPath>
<clipPath id="cCursor"><rect x="615" y="420" width="545" height="270" rx="24"/></clipPath>
</defs>

<!-- Pure OLED Background -->
<rect width="1200" height="760" fill="#000000"/>

<!-- ============================================================ -->
<!-- 1. HERO SCREEN (LANDSCAPE): FULLSCREEN APPS DOCK             -->
<!-- ============================================================ -->
<g>
  <rect x="230" y="25" width="740" height="340" rx="28" class="phone"/>
  <!-- Punch hole camera on left edge -->
  <circle cx="248" cy="195" r="5" fill="#141720" stroke="#000000" stroke-width="1.5"/>
  
  <g clip-path="url(#cHero)">
    <!-- Top Horizontal Bar -->
    <rect x="264" y="38" width="692" height="36" rx="8" fill="#0A0C10" stroke="#1E232E"/>
    
    <!-- Left: Host badge -->
    <circle cx="280" cy="56" r="3.5" fill="#22C55E"/>
    <text x="290" y="60" class="white" font-size="11" font-weight="700">DESKTOP-PC</text>
    
    <!-- Center: 3 Sections Switcher -->
    <g transform="translate(485 43)">
      <rect x="0" y="0" width="250" height="26" rx="6" fill="#0F1218" stroke="#1F242D"/>
      <!-- Active Tab: Приложения -->
      <rect x="2" y="2" width="84" height="22" rx="5" fill="#141722" stroke="#38BDF8" stroke-opacity="0.6"/>
      <text x="44" y="17" class="white" font-size="10" font-weight="800" text-anchor="middle">Приложения</text>
      
      <!-- Tab 2: Плеер -->
      <text x="127" y="17" class="sub" font-size="10" font-weight="600" text-anchor="middle">Плеер</text>
      
      <!-- Tab 3: Курсор -->
      <text x="209" y="17" class="sub" font-size="10" font-weight="600" text-anchor="middle">Курсор</text>
    </g>
    
    <!-- Right: Volume & Disconnect -->
    <g transform="translate(860 44)">
      <rect x="0" y="0" width="24" height="24" rx="5" fill="#141722" stroke="#1F2432"/>
      <text x="12" y="16" class="sub" font-size="12" font-weight="700" text-anchor="middle">−</text>
      
      <rect x="28" y="0" width="38" height="24" rx="5" fill="#141722" stroke="#1F2432"/>
      <text x="47" y="16" fill="#38BDF8" font-size="10" font-weight="800" text-anchor="middle">74%</text>
      
      <rect x="70" y="0" width="24" height="24" rx="5" fill="#141722" stroke="#1F2432"/>
      <text x="82" y="16" class="sub" font-size="12" font-weight="700" text-anchor="middle">+</text>
    </g>
    
    <!-- Search Row -->
    <g transform="translate(264 84)">
      <rect x="0" y="0" width="280" height="28" rx="6" fill="#0C0E14" stroke="#1F2432"/>
      <circle cx="16" cy="14" r="4.5" fill="none" stroke="#8B949E" stroke-width="1.2"/>
      <line x1="19" y1="17" x2="23" y2="21" stroke="#8B949E" stroke-width="1.2"/>
      <text x="32" y="18" class="sub" font-size="10">Поиск по меню Пуск и играм...</text>
      <text x="692" y="18" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="end">★ 4 в избранном · 42 приложения</text>
    </g>
    
    <!-- 7-Column App Grid -->
    <!-- Row 1 -->
    <g transform="translate(264 120)">
      <!-- App 1: Chrome (Fav) -->
      <rect x="0" y="0" width="92" height="74" rx="8" fill="#131722" stroke="#38BDF8" stroke-opacity="0.6"/>
      <circle cx="46" cy="28" r="14" fill="#2563EB"/>
      <circle cx="46" cy="28" r="6" fill="#FFFFFF"/>
      <text x="46" y="58" class="white" font-size="10" font-weight="700" text-anchor="middle">Chrome</text>
      <circle cx="82" cy="10" r="2.5" fill="#38BDF8"/>
      
      <!-- App 2: Spotify (Fav) -->
      <rect x="100" y="0" width="92" height="74" rx="8" fill="#131722" stroke="#38BDF8" stroke-opacity="0.6"/>
      <circle cx="146" cy="28" r="14" fill="#16A34A"/>
      <path d="M141 27C144 25 149 26 151 27M140 31C143 29 148 30 151 32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="146" y="58" class="white" font-size="10" font-weight="700" text-anchor="middle">Spotify</text>
      <circle cx="182" cy="10" r="2.5" fill="#38BDF8"/>
      
      <!-- App 3: VS Code (Fav) -->
      <rect x="200" y="0" width="92" height="74" rx="8" fill="#131722" stroke="#38BDF8" stroke-opacity="0.6"/>
      <rect x="232" y="14" width="28" height="28" rx="6" fill="#0284C7"/>
      <path d="M240 28L248 22V34L240 28Z" fill="#FFFFFF"/>
      <text x="246" y="58" class="white" font-size="10" font-weight="700" text-anchor="middle">VS Code</text>
      <circle cx="282" cy="10" r="2.5" fill="#38BDF8"/>
      
      <!-- App 4: Steam (Fav) -->
      <rect x="300" y="0" width="92" height="74" rx="8" fill="#131722" stroke="#38BDF8" stroke-opacity="0.6"/>
      <circle cx="346" cy="28" r="14" fill="#1E293B"/>
      <circle cx="343" cy="26" r="4" fill="#FFFFFF"/>
      <circle cx="350" cy="32" r="3" fill="#FFFFFF"/>
      <text x="346" y="58" class="white" font-size="10" font-weight="700" text-anchor="middle">Steam</text>
      <circle cx="382" cy="10" r="2.5" fill="#38BDF8"/>
      
      <!-- App 5: Terminal -->
      <rect x="400" y="0" width="92" height="74" rx="8" class="card"/>
      <rect x="432" y="14" width="28" height="28" rx="6" fill="#181B22"/>
      <text x="446" y="33" class="white" font-size="12" font-weight="800" text-anchor="middle">&gt;_</text>
      <text x="446" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Terminal</text>
      
      <!-- App 6: Telegram -->
      <rect x="500" y="0" width="92" height="74" rx="8" class="card"/>
      <circle cx="546" cy="28" r="14" fill="#0284C7"/>
      <path d="M540 28L552 23L549 34L546 30L540 28Z" fill="#FFFFFF"/>
      <text x="546" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Telegram</text>
      
      <!-- App 7: Blender -->
      <rect x="600" y="0" width="92" height="74" rx="8" class="card"/>
      <circle cx="646" cy="28" r="14" fill="#EA580C"/>
      <circle cx="646" cy="28" r="5" fill="#FFFFFF"/>
      <text x="646" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Blender</text>
    </g>
    
    <!-- Row 2 -->
    <g transform="translate(264 202)">
      <!-- App 8: Discord -->
      <rect x="0" y="0" width="92" height="74" rx="8" class="card"/>
      <circle cx="46" cy="28" r="14" fill="#4F46E5"/>
      <circle cx="41" cy="27" r="2.5" fill="#FFFFFF"/>
      <circle cx="51" cy="27" r="2.5" fill="#FFFFFF"/>
      <text x="46" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Discord</text>
      
      <!-- App 9: Photoshop -->
      <rect x="100" y="0" width="92" height="74" rx="8" class="card"/>
      <rect x="132" y="14" width="28" height="28" rx="6" fill="#001E36"/>
      <text x="146" y="32" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">Ps</text>
      <text x="146" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Photoshop</text>
      
      <!-- App 10: Notion -->
      <rect x="200" y="0" width="92" height="74" rx="8" class="card"/>
      <rect x="232" y="14" width="28" height="28" rx="6" fill="#1F242E"/>
      <text x="246" y="33" class="white" font-size="12" font-weight="800" text-anchor="middle">N</text>
      <text x="246" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Notion</text>
      
      <!-- App 11: Obsidian -->
      <rect x="300" y="0" width="92" height="74" rx="8" class="card"/>
      <rect x="332" y="14" width="28" height="28" rx="6" fill="#3B1C54"/>
      <text x="346" y="33" fill="#C084FC" font-size="12" font-weight="800" text-anchor="middle">◆</text>
      <text x="346" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Obsidian</text>
      
      <!-- App 12: Figma -->
      <rect x="400" y="0" width="92" height="74" rx="8" class="card"/>
      <circle cx="441" cy="24" r="5" fill="#EF4444"/>
      <circle cx="451" cy="24" r="5" fill="#F97316"/>
      <circle cx="441" cy="33" r="5" fill="#8B5CF6"/>
      <text x="446" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Figma</text>
      
      <!-- App 13: Explorer -->
      <rect x="500" y="0" width="92" height="74" rx="8" class="card"/>
      <rect x="532" y="16" width="28" height="22" rx="4" fill="#EAB308"/>
      <text x="546" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Проводник</text>
      
      <!-- App 14: Calculator -->
      <rect x="600" y="0" width="92" height="74" rx="8" class="card"/>
      <rect x="632" y="14" width="28" height="28" rx="6" fill="#181B22"/>
      <text x="646" y="33" class="white" font-size="12" font-weight="700" text-anchor="middle">±</text>
      <text x="646" y="58" class="white" font-size="10" font-weight="600" text-anchor="middle">Калькулятор</text>
    </g>
    
    <!-- Row 3 preview -->
    <g transform="translate(264 284)">
      <rect x="0" y="0" width="92" height="74" rx="8" class="card"/>
      <text x="46" y="40" class="sub" font-size="10" text-anchor="middle">Игры...</text>
      
      <rect x="100" y="0" width="92" height="74" rx="8" class="card"/>
      <text x="146" y="40" class="sub" font-size="10" text-anchor="middle">Браузеры...</text>
      
      <rect x="200" y="0" width="92" height="74" rx="8" class="card"/>
      <text x="246" y="40" class="sub" font-size="10" text-anchor="middle">Утилиты...</text>
    </g>
  </g>
</g>
<text x="600" y="390" class="white" font-size="14" font-weight="800" text-anchor="middle">1. Раздел «Приложения» · Полноэкранный деск-док на подставке</text>

<!-- ============================================================ -->
<!-- 2. SCREEN 2 (LANDSCAPE): MEDIA PLAYER DECK                   -->
<!-- ============================================================ -->
<g>
  <rect x="40" y="420" width="545" height="270" rx="24" class="phone"/>
  <circle cx="54" cy="555" r="4" fill="#141720" stroke="#000000" stroke-width="1.5"/>
  
  <g clip-path="url(#cMedia)">
    <!-- Top Bar -->
    <rect x="68" y="432" width="497" height="32" rx="6" fill="#0A0C10" stroke="#1E232E"/>
    <circle cx="80" cy="448" r="3" fill="#22C55E"/>
    <text x="88" y="452" class="white" font-size="10" font-weight="700">DESKTOP-PC</text>
    
    <g transform="translate(230 436)">
      <rect x="0" y="0" width="180" height="24" rx="5" fill="#0F1218" stroke="#1F242D"/>
      <text x="30" y="16" class="sub" font-size="9" text-anchor="middle">Приложения</text>
      <rect x="58" y="2" width="64" height="20" rx="4" fill="#141722" stroke="#38BDF8" stroke-opacity="0.6"/>
      <text x="90" y="16" class="white" font-size="9" font-weight="800" text-anchor="middle">Плеер</text>
      <text x="150" y="16" class="sub" font-size="9" text-anchor="middle">Курсор</text>
    </g>
    
    <text x="550" y="452" class="sub" font-size="11" text-anchor="end">74%</text>
    
    <!-- 3 Column Deck -->
    <g transform="translate(68 474)">
      <!-- Col 1: Volume Card -->
      <rect x="0" y="0" width="155" height="200" rx="10" class="card"/>
      <text x="12" y="22" class="sub" font-size="9" font-weight="700" letter-spacing="0.5">МАСТЕР-ГРОМКОСТЬ</text>
      <text x="12" y="62" class="white" font-size="34" font-weight="800">74%</text>
      
      <!-- Stepper and Slider -->
      <rect x="12" y="80" width="131" height="6" rx="3" fill="#1A1D26"/>
      <rect x="12" y="80" width="97" height="6" rx="3" fill="#38BDF8"/>
      
      <rect x="12" y="100" width="28" height="28" rx="6" class="cardLight"/>
      <text x="26" y="118" class="white" font-size="11" font-weight="700" text-anchor="middle">−5</text>
      
      <rect x="46" y="100" width="63" height="28" rx="6" fill="#141722" stroke="#1F2432"/>
      <text x="77" y="118" fill="#38BDF8" font-size="10" font-weight="800" text-anchor="middle">MUTE</text>
      
      <rect x="115" y="100" width="28" height="28" rx="6" class="cardLight"/>
      <text x="129" y="118" class="white" font-size="11" font-weight="700" text-anchor="middle">+5</text>
      
      <text x="12" y="152" class="sub" font-size="8">Core Audio COM API</text>
      <text x="12" y="168" class="sub" font-size="8">Мгновенная синхронизация</text>
      
      <!-- Col 2: Media Controller -->
      <rect x="165" y="0" width="195" height="200" rx="10" class="card"/>
      <text x="177" y="22" class="sub" font-size="9" font-weight="700" letter-spacing="0.5">УПРАВЛЕНИЕ МЕДИА</text>
      
      <!-- Controls Row -->
      <g transform="translate(177 50)">
        <!-- Prev -->
        <circle cx="22" cy="30" r="22" fill="#141722" stroke="#1F2432"/>
        <text x="22" y="34" class="white" font-size="11" font-weight="700" text-anchor="middle">◀◀</text>
        
        <!-- Play / Pause -->
        <circle cx="85" cy="30" r="32" fill="#FFFFFF"/>
        <path d="M80 20L95 30L80 40Z" fill="#000000"/>
        
        <!-- Next -->
        <circle cx="148" cy="30" r="22" fill="#141722" stroke="#1F2432"/>
        <text x="148" y="34" class="white" font-size="11" font-weight="700" text-anchor="middle">▶▶</text>
      </g>
      
      <!-- Chips -->
      <rect x="177" y="128" width="80" height="28" rx="6" class="cardLight"/>
      <text x="217" y="146" class="white" font-size="10" font-weight="700" text-anchor="middle">STOP</text>
      
      <rect x="263" y="128" width="85" height="28" rx="6" class="cardLight"/>
      <text x="305" y="146" class="white" font-size="10" font-weight="700" text-anchor="middle">ПРОБЕЛ</text>
      
      <text x="262" y="180" class="sub" font-size="9" text-anchor="middle">Spotify · YouTube · VLC</text>
      
      <!-- Col 3: System Shortcuts -->
      <rect x="370" y="0" width="127" height="200" rx="10" class="card"/>
      <text x="380" y="22" class="sub" font-size="9" font-weight="700" letter-spacing="0.5">СИСТЕМА</text>
      
      <rect x="378" y="36" width="111" height="28" rx="6" class="cardLight"/>
      <text x="386" y="54" class="white" font-size="9" font-weight="600">Блокировка</text>
      <text x="482" y="54" class="sub" font-size="8" text-anchor="end">Win+L</text>
      
      <rect x="378" y="70" width="111" height="28" rx="6" class="cardLight"/>
      <text x="386" y="88" class="white" font-size="9" font-weight="600">Рабочий стол</text>
      <text x="482" y="88" class="sub" font-size="8" text-anchor="end">Win+D</text>
      
      <rect x="378" y="104" width="111" height="28" rx="6" class="cardLight"/>
      <text x="386" y="122" class="white" font-size="9" font-weight="600">Окно</text>
      <text x="482" y="122" class="sub" font-size="8" text-anchor="end">Alt+Tab</text>
      
      <rect x="378" y="138" width="111" height="28" rx="6" class="cardLight"/>
      <text x="386" y="156" class="white" font-size="9" font-weight="600">Мониторы</text>
      <text x="482" y="156" class="sub" font-size="8" text-anchor="end">Выкл</text>
    </g>
  </g>
</g>
<text x="312" y="720" class="white" font-size="13" font-weight="800" text-anchor="middle">2. Раздел «Плеер» · Громкость, плеер и системные шорткаты</text>

<!-- ============================================================ -->
<!-- 3. SCREEN 3 (LANDSCAPE): CURSOR TRACKPAD                     -->
<!-- ============================================================ -->
<g>
  <rect x="615" y="420" width="545" height="270" rx="24" class="phone"/>
  <circle cx="629" cy="555" r="4" fill="#141720" stroke="#000000" stroke-width="1.5"/>
  
  <g clip-path="url(#cCursor)">
    <!-- Top Bar -->
    <rect x="643" y="432" width="497" height="32" rx="6" fill="#0A0C10" stroke="#1E232E"/>
    <circle cx="655" cy="448" r="3" fill="#22C55E"/>
    <text x="663" y="452" class="white" font-size="10" font-weight="700">DESKTOP-PC</text>
    
    <g transform="translate(805 436)">
      <rect x="0" y="0" width="180" height="24" rx="5" fill="#0F1218" stroke="#1F242D"/>
      <text x="30" y="16" class="sub" font-size="9" text-anchor="middle">Приложения</text>
      <text x="90" y="16" class="sub" font-size="9" text-anchor="middle">Плеер</text>
      <rect x="118" y="2" width="60" height="20" rx="4" fill="#141722" stroke="#38BDF8" stroke-opacity="0.6"/>
      <text x="148" y="16" class="white" font-size="9" font-weight="800" text-anchor="middle">Курсор</text>
    </g>
    
    <text x="1125" y="452" fill="#A78BFA" font-size="10" font-weight="700" text-anchor="end">60 FPS</text>
    
    <!-- Touch Area (Large Canvas) -->
    <rect x="643" y="474" width="375" height="200" rx="10" class="card"/>
    <circle cx="830" cy="570" r="3" fill="#38BDF8" opacity="0.6"/>
    <circle cx="830" cy="570" r="28" fill="none" stroke="#38BDF8" stroke-dasharray="3 3" opacity="0.3"/>
    <text x="830" y="610" class="white" font-size="12" font-weight="700" text-anchor="middle">Широкая сенсорная панель мыши</text>
    <text x="830" y="628" class="sub" font-size="9" text-anchor="middle">Тап = ЛКМ · Двойной тап = Клик · Удержание = ПКМ</text>
    
    <!-- Right Control Column: Scroll & LKM / PKM -->
    <g transform="translate(1028 474)">
      <!-- Scroll Up -->
      <rect x="0" y="0" width="112" height="44" rx="8" class="card"/>
      <text x="56" y="26" class="white" font-size="10" font-weight="700" text-anchor="middle">▲ СКРОЛЛ</text>
      
      <!-- Scroll Down -->
      <rect x="0" y="52" width="112" height="44" rx="8" class="card"/>
      <text x="56" y="78" class="white" font-size="10" font-weight="700" text-anchor="middle">▼ СКРОЛЛ</text>
      
      <!-- LKM Button -->
      <rect x="0" y="104" width="112" height="44" rx="8" class="cardLight"/>
      <text x="56" y="131" class="white" font-size="13" font-weight="800" text-anchor="middle">LKM</text>
      
      <!-- PKM Button -->
      <rect x="0" y="156" width="112" height="44" rx="8" class="cardLight"/>
      <text x="56" y="183" class="white" font-size="13" font-weight="800" text-anchor="middle">PKM</text>
    </g>
  </g>
</g>
<text x="887" y="720" class="white" font-size="13" font-weight="800" text-anchor="middle">3. Раздел «Курсор» · Полноэкранный трекпад с аппаратными кнопками</text>

</svg>