<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Pult Mobile Interface Screens">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap');
text { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.card{fill:#090B0E;stroke:#22262F;stroke-width:1.5}
.phone{fill:#050608;stroke:#1F242D;stroke-width:2}
.sub{fill:#8C95A3}
.white{fill:#FFFFFF}
.line{stroke:#1F242D;stroke-width:1}
</style>
<defs>
<clipPath id="p1"><rect x="30" y="30" width="265" height="580" rx="36"/></clipPath>
<clipPath id="p2"><rect x="325" y="30" width="265" height="580" rx="36"/></clipPath>
<clipPath id="p3"><rect x="620" y="30" width="265" height="580" rx="36"/></clipPath>
<clipPath id="p4"><rect x="915" y="30" width="265" height="580" rx="36"/></clipPath>
</defs>

<!-- Pure OLED Background -->
<rect width="1200" height="680" fill="#000000"/>

<!-- ==================== PHONE 1: MEDIA REMOTE ==================== -->
<g>
  <rect x="30" y="30" width="265" height="580" rx="36" class="phone"/>
  <rect x="30" y="30" width="265" height="580" rx="36" fill="none" stroke="#2B3242" stroke-width="1"/>
  
  <!-- Notch -->
  <rect x="117" y="40" width="90" height="18" rx="9" fill="#0D0F14"/>
  <circle cx="185" cy="49" r="4" fill="#1C212B"/>
  
  <!-- Content -->
  <g clip-path="url(#p1)">
    <!-- Top Bar: Connected status -->
    <rect x="44" y="68" width="237" height="36" rx="10" fill="#0F1218" stroke="#1F242D"/>
    <circle cx="58" cy="86" r="4" fill="#4ADE80"/>
    <text x="70" y="90" class="white" font-size="12" font-weight="700">DESKTOP-PC</text>
    <text x="210" y="90" fill="#4ADE80" font-size="11" font-weight="600">Online</text>
    
    <!-- Volume Slider Card -->
    <rect x="44" y="114" width="237" height="74" rx="14" class="card"/>
    <text x="58" y="136" class="white" font-size="12" font-weight="700">Master Volume</text>
    <text x="248" y="136" fill="#38BDF8" font-size="13" font-weight="800">74%</text>
    <!-- Slider Track -->
    <rect x="58" y="148" width="209" height="8" rx="4" fill="#171B24"/>
    <rect x="58" y="148" width="155" height="8" rx="4" fill="#38BDF8"/>
    <circle cx="213" cy="152" r="8" fill="#FFFFFF"/>
    <text x="58" y="174" class="sub" font-size="10">Core Audio COM API Sync</text>
    <text x="238" y="174" fill="#E8B04A" font-size="10" font-weight="700">Mute</text>
    
    <!-- Circular Remote D-Pad -->
    <g transform="translate(162 315)">
      <!-- Outer Dial -->
      <circle cx="0" cy="0" r="105" fill="#0C0E13" stroke="#222834" stroke-width="2"/>
      
      <!-- Vol + -->
      <rect x="-35" y="-98" width="70" height="38" rx="8" fill="#141720"/>
      <text x="0" y="-74" class="white" font-size="12" font-weight="700" text-anchor="middle">VOL +</text>
      
      <!-- Vol - -->
      <rect x="-35" y="60" width="70" height="38" rx="8" fill="#141720"/>
      <text x="0" y="84" class="white" font-size="12" font-weight="700" text-anchor="middle">VOL −</text>
      
      <!-- Prev -->
      <rect x="-98" y="-35" width="38" height="70" rx="8" fill="#141720"/>
      <path d="M-84 -8L-74 0L-84 8Z" fill="#FFFFFF"/>
      <path d="M-74 -8L-64 0L-74 8Z" fill="#FFFFFF"/>
      
      <!-- Next -->
      <rect x="60" y="-35" width="38" height="70" rx="8" fill="#141720"/>
      <path d="M74 -8L84 0L74 8Z" fill="#FFFFFF"/>
      <path d="M84 -8L94 0L84 8Z" fill="#FFFFFF"/>
      
      <!-- Center OK / Play-Pause -->
      <circle cx="0" cy="0" r="42" fill="#1E232E" stroke="#333C4D" stroke-width="2"/>
      <path d="M-6 -10L8 0L-6 10Z" fill="#FFFFFF"/>
      <line x1="8" y1="-8" x2="8" y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Quick Transport Buttons -->
    <rect x="44" y="445" width="72" height="42" rx="10" class="card"/>
    <text x="80" y="471" class="white" font-size="11" font-weight="700" text-anchor="middle">MUTE</text>
    
    <rect x="126" y="445" width="73" height="42" rx="10" class="card"/>
    <text x="162" y="471" class="white" font-size="11" font-weight="700" text-anchor="middle">SPACE</text>
    
    <rect x="209" y="445" width="72" height="42" rx="10" class="card"/>
    <text x="245" y="471" class="white" font-size="11" font-weight="700" text-anchor="middle">STOP</text>
    
    <!-- Tab Bar -->
    <rect x="30" y="555" width="265" height="55" fill="#08090C" stroke="#1A1D24"/>
    <text x="65" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Приложения</text>
    <text x="120" y="586" fill="#38BDF8" font-size="10" font-weight="800" text-anchor="middle">Медиа</text>
    <circle cx="120" cy="596" r="2" fill="#38BDF8"/>
    <text x="165" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Мышь</text>
    <text x="210" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Система</text>
    <text x="255" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Окна</text>
  </g>
</g>
<text x="162" y="640" class="white" font-size="14" font-weight="800" text-anchor="middle">1. Media Remote</text>
<text x="162" y="658" class="sub" font-size="11" text-anchor="middle">Core Audio Slider &amp; D-Pad</text>

<!-- ==================== PHONE 2: TRACKPAD ==================== -->
<g>
  <rect x="325" y="30" width="265" height="580" rx="36" class="phone"/>
  <rect x="325" y="30" width="265" height="580" rx="36" fill="none" stroke="#2B3242" stroke-width="1"/>
  
  <rect x="412" y="40" width="90" height="18" rx="9" fill="#0D0F14"/>
  <circle cx="480" cy="49" r="4" fill="#1C212B"/>
  
  <g clip-path="url(#p2)">
    <rect x="339" y="68" width="237" height="36" rx="10" fill="#0F1218" stroke="#1F242D"/>
    <circle cx="353" cy="86" r="4" fill="#4ADE80"/>
    <text x="365" y="90" class="white" font-size="12" font-weight="700">DESKTOP-PC</text>
    <text x="515" y="90" fill="#A78BFA" font-size="11" font-weight="600">60 FPS</text>
    
    <!-- Touch Area -->
    <rect x="339" y="114" width="202" height="360" rx="18" fill="#0C0E14" stroke="#222834"/>
    <!-- Center Cross / Grid dot -->
    <circle cx="440" cy="294" r="3" fill="#38BDF8" opacity="0.6"/>
    <circle cx="440" cy="294" r="32" fill="none" stroke="#38BDF8" stroke-dasharray="4 4" opacity="0.3"/>
    <text x="440" y="350" class="sub" font-size="12" font-weight="600" text-anchor="middle">Touch &amp; Drag Surface</text>
    <text x="440" y="368" fill="#4B5563" font-size="10" text-anchor="middle">Tap = Click · Hold = Right Click</text>
    
    <!-- Scroll Strip -->
    <rect x="548" y="114" width="28" height="360" rx="14" fill="#0F1218" stroke="#222834"/>
    <path d="M562 135L567 142H557Z" fill="#A1A1AA"/>
    <path d="M562 455L567 448H557Z" fill="#A1A1AA"/>
    <rect x="554" y="240" width="16" height="40" rx="8" fill="#2B3242"/>
    
    <!-- Bottom Physical Mouse Buttons -->
    <rect x="339" y="484" width="114" height="60" rx="14" fill="#141720" stroke="#2B3242"/>
    <text x="396" y="520" class="white" font-size="14" font-weight="800" text-anchor="middle">LKM</text>
    
    <rect x="462" y="484" width="114" height="60" rx="14" fill="#141720" stroke="#2B3242"/>
    <text x="519" y="520" class="white" font-size="14" font-weight="800" text-anchor="middle">PKM</text>
    
    <!-- Tab Bar -->
    <rect x="325" y="555" width="265" height="55" fill="#08090C" stroke="#1A1D24"/>
    <text x="360" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Приложения</text>
    <text x="415" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Медиа</text>
    <text x="460" y="586" fill="#A78BFA" font-size="10" font-weight="800" text-anchor="middle">Мышь</text>
    <circle cx="460" cy="596" r="2" fill="#A78BFA"/>
    <text x="505" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Система</text>
    <text x="550" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Окна</text>
  </g>
</g>
<text x="457" y="640" class="white" font-size="14" font-weight="800" text-anchor="middle">2. Wireless Trackpad</text>
<text x="457" y="658" class="sub" font-size="11" text-anchor="middle">60 FPS Cursor &amp; Gestures</text>

<!-- ==================== PHONE 3: APPS LAUNCHPAD ==================== -->
<g>
  <rect x="620" y="30" width="265" height="580" rx="36" class="phone"/>
  <rect x="620" y="30" width="265" height="580" rx="36" fill="none" stroke="#2B3242" stroke-width="1"/>
  
  <rect x="707" y="40" width="90" height="18" rx="9" fill="#0D0F14"/>
  <circle cx="775" cy="49" r="4" fill="#1C212B"/>
  
  <g clip-path="url(#p3)">
    <rect x="634" y="68" width="237" height="36" rx="10" fill="#0F1218" stroke="#1F242D"/>
    <circle cx="648" cy="86" r="4" fill="#4ADE80"/>
    <text x="660" y="90" class="white" font-size="12" font-weight="700">DESKTOP-PC</text>
    <text x="830" y="90" fill="#34D399" font-size="11" font-weight="600">42 Apps</text>
    
    <!-- Search Bar -->
    <rect x="634" y="114" width="237" height="36" rx="10" fill="#12151D" stroke="#28303F"/>
    <circle cx="650" cy="132" r="5" fill="none" stroke="#8C95A3" stroke-width="1.5"/>
    <line x1="654" y1="136" x2="658" y2="140" stroke="#8C95A3" stroke-width="1.5"/>
    <text x="666" y="136" class="sub" font-size="11">Search Start menu &amp; games...</text>
    
    <!-- Favorites Section -->
    <text x="634" y="172" class="white" font-size="11" font-weight="800">PINNED FAVORITES</text>
    
    <!-- App 1: Chrome -->
    <rect x="634" y="184" width="112" height="76" rx="12" class="card"/>
    <circle cx="690" cy="214" r="14" fill="#2563EB"/>
    <circle cx="690" cy="214" r="6" fill="#FFFFFF"/>
    <text x="690" y="246" class="white" font-size="11" font-weight="700" text-anchor="middle">Chrome</text>
    
    <!-- App 2: Spotify -->
    <rect x="759" y="184" width="112" height="76" rx="12" class="card"/>
    <circle cx="815" cy="214" r="14" fill="#16A34A"/>
    <path d="M809 212C813 210 819 211 822 213M808 216C812 214 817 215 821 217M810 220C813 219 816 219 819 221" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="815" y="246" class="white" font-size="11" font-weight="700" text-anchor="middle">Spotify</text>
    
    <!-- App 3: VS Code -->
    <rect x="634" y="268" width="112" height="76" rx="12" class="card"/>
    <rect x="676" y="200" width="28" height="28" rx="6" fill="#0284C7"/>
    <path d="M684 214L692 208V220L684 214Z" fill="#FFFFFF"/>
    <text x="690" y="330" class="white" font-size="11" font-weight="700" text-anchor="middle">VS Code</text>
    
    <!-- App 4: Steam -->
    <rect x="759" y="268" width="112" height="76" rx="12" class="card"/>
    <circle cx="815" cy="298" r="14" fill="#1E293B"/>
    <circle cx="812" cy="295" r="4" fill="#FFFFFF"/>
    <circle cx="820" cy="303" r="3" fill="#FFFFFF"/>
    <text x="815" y="330" class="white" font-size="11" font-weight="700" text-anchor="middle">Steam</text>
    
    <!-- All Apps List -->
    <text x="634" y="370" class="white" font-size="11" font-weight="800">ALL APPLICATIONS</text>
    
    <!-- Row 1: Terminal -->
    <rect x="634" y="382" width="237" height="46" rx="10" class="card"/>
    <rect x="644" y="393" width="24" height="24" rx="5" fill="#1E232E"/>
    <text x="652" y="409" class="white" font-size="12" font-weight="700">&gt;_</text>
    <text x="678" y="406" class="white" font-size="12" font-weight="600">Windows Terminal</text>
    <text x="678" y="419" class="sub" font-size="9">PowerShell 7</text>
    <rect x="835" y="394" width="26" height="22" rx="5" fill="#19202D"/>
    <text x="848" y="409" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">▶</text>
    
    <!-- Row 2: Telegram -->
    <rect x="634" y="434" width="237" height="46" rx="10" class="card"/>
    <circle cx="656" cy="457" r="12" fill="#0284C7"/>
    <path d="M650 457L662 452L659 463L656 459L650 457Z" fill="#FFFFFF"/>
    <text x="678" y="458" class="white" font-size="12" font-weight="600">Telegram Desktop</text>
    <text x="678" y="471" class="sub" font-size="9">Messenger</text>
    <rect x="835" y="446" width="26" height="22" rx="5" fill="#19202D"/>
    <text x="848" y="461" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">▶</text>
    
    <!-- Tab Bar -->
    <rect x="620" y="555" width="265" height="55" fill="#08090C" stroke="#1A1D24"/>
    <text x="655" y="586" fill="#38BDF8" font-size="10" font-weight="800" text-anchor="middle">Приложения</text>
    <circle cx="655" cy="596" r="2" fill="#38BDF8"/>
    <text x="710" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Медиа</text>
    <text x="755" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Мышь</text>
    <text x="800" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Система</text>
    <text x="845" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Окна</text>
  </g>
</g>
<text x="752" y="640" class="white" font-size="14" font-weight="800" text-anchor="middle">3. Apps Launchpad</text>
<text x="752" y="658" class="sub" font-size="11" text-anchor="middle">Instant Start Menu Dock</text>

<!-- ==================== PHONE 4: SYSTEM & TASKS ==================== -->
<g>
  <rect x="915" y="30" width="265" height="580" rx="36" class="phone"/>
  <rect x="915" y="30" width="265" height="580" rx="36" fill="none" stroke="#2B3242" stroke-width="1"/>
  
  <rect x="1002" y="40" width="90" height="18" rx="9" fill="#0D0F14"/>
  <circle cx="1070" cy="49" r="4" fill="#1C212B"/>
  
  <g clip-path="url(#p4)">
    <rect x="929" y="68" width="237" height="36" rx="10" fill="#0F1218" stroke="#1F242D"/>
    <circle cx="943" cy="86" r="4" fill="#4ADE80"/>
    <text x="955" y="90" class="white" font-size="12" font-weight="700">DESKTOP-PC</text>
    <text x="1105" y="90" fill="#F87171" font-size="11" font-weight="600">Controls</text>
    
    <!-- System Controls Grid -->
    <text x="929" y="124" class="white" font-size="11" font-weight="800">POWER &amp; SYSTEM</text>
    
    <rect x="929" y="134" width="112" height="56" rx="10" class="card"/>
    <text x="941" y="156" class="white" font-size="11" font-weight="700">Lock PC</text>
    <text x="941" y="174" class="sub" font-size="9">Win + L</text>
    
    <rect x="1054" y="134" width="112" height="56" rx="10" class="card"/>
    <text x="1066" y="156" class="white" font-size="11" font-weight="700">Desktop</text>
    <text x="1066" y="174" class="sub" font-size="9">Win + D</text>
    
    <rect x="929" y="196" width="112" height="56" rx="10" class="card"/>
    <text x="941" y="218" class="white" font-size="11" font-weight="700">Monitors Off</text>
    <text x="941" y="236" class="sub" font-size="9">Low Power</text>
    
    <rect x="1054" y="196" width="112" height="56" rx="10" class="card"/>
    <text x="1066" y="218" fill="#F87171" font-size="11" font-weight="700">Sleep PC</text>
    <text x="1066" y="236" class="sub" font-size="9">Standby</text>
    
    <!-- Active Windows List -->
    <text x="929" y="278" class="white" font-size="11" font-weight="800">RUNNING WINDOWS</text>
    
    <!-- Window 1: Chrome -->
    <rect x="929" y="290" width="237" height="54" rx="10" class="card"/>
    <text x="941" y="312" class="white" font-size="11" font-weight="700">YouTube — Chrome</text>
    <text x="941" y="330" class="sub" font-size="9">Active Window</text>
    <rect x="1115" y="303" width="42" height="26" rx="6" fill="#1C2433"/>
    <text x="1136" y="320" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="middle">Focus</text>
    
    <!-- Window 2: VS Code -->
    <rect x="929" y="352" width="237" height="54" rx="10" class="card"/>
    <text x="941" y="374" class="white" font-size="11" font-weight="700">Pult.cs — VS Code</text>
    <text x="941" y="392" class="sub" font-size="9">PID: 14208</text>
    <rect x="1115" y="365" width="42" height="26" rx="6" fill="#1C2433"/>
    <text x="1136" y="382" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="middle">Focus</text>
    
    <!-- Window 3: Frozen Game -->
    <rect x="929" y="414" width="237" height="54" rx="10" fill="#170F12" stroke="#4A1D24"/>
    <text x="941" y="436" fill="#FCA5A5" font-size="11" font-weight="700">Game (Hung Process)</text>
    <text x="941" y="454" fill="#F87171" font-size="9">PID: 8940 · Not Responding</text>
    <rect x="1115" y="427" width="42" height="26" rx="6" fill="#450A0A" stroke="#7F1D1D"/>
    <text x="1136" y="444" fill="#F87171" font-size="10" font-weight="800" text-anchor="middle">KILL</text>
    
    <!-- Tab Bar -->
    <rect x="915" y="555" width="265" height="55" fill="#08090C" stroke="#1A1D24"/>
    <text x="950" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Приложения</text>
    <text x="1005" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Медиа</text>
    <text x="1050" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Мышь</text>
    <text x="1095" y="586" fill="#F87171" font-size="10" font-weight="800" text-anchor="middle">Система</text>
    <circle cx="1095" cy="596" r="2" fill="#F87171"/>
    <text x="1140" y="586" class="sub" font-size="10" font-weight="600" text-anchor="middle">Окна</text>
  </g>
</g>
<text x="1047" y="640" class="white" font-size="14" font-weight="800" text-anchor="middle">4. System &amp; Tasks</text>
<text x="1047" y="658" class="sub" font-size="11" text-anchor="middle">One-Tap Lock &amp; Window Killer</text>
</svg>