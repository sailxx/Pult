<svg xmlns="http://www.w3.org/2000/svg" width="260" height="52" viewBox="0 0 260 52" role="img" aria-label="Download Pult for Windows">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&amp;display=swap');
text { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.btn{cursor:pointer;transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.sweep{animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120%)}40%,100%{transform:translateX(240%)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none}}
</style>
<defs>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
  <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".25"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
  <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".08"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<clipPath id="btnClip"><rect width="260" height="52" rx="14"/></clipPath>
</defs>

<g class="btn" clip-path="url(#btnClip)">
  <rect width="260" height="52" rx="14" fill="#0A0A0A" stroke="#262626" stroke-width="1.5"/>
  <rect class="sweep" x="0" y="0" width="100" height="52" fill="url(#sw)"/>
  <rect x="20" y="1" width="220" height="1" fill="url(#hl)"/>
  
  <!-- Windows Icon -->
  <g fill="#FFFFFF" transform="translate(18 16)">
    <path d="M0 2.8L8 1.6V9.4H0V2.8ZM8.9 1.5L20 0V9.4H8.9V1.5ZM0 10.4H8V18.2L0 17.1V10.4ZM8.9 10.4H20V19.8L8.9 18.3V10.4Z"/>
  </g>
  
  <!-- Typography (Solid Manrope Text) -->
  <text x="50" y="24" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="-0.2">Download for Windows</text>
  <text x="50" y="39" fill="#A1A1AA" font-size="11" font-weight="500">Pult.exe · 40 KB · Zero install</text>
</g>
</svg>