  <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".12"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<clipPath id="btnClip"><rect width="260" height="52" rx="14"/></clipPath>
</defs>

