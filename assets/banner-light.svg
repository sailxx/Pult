  <rect x="0" y="0" width="112" height="112" rx="25" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
  <!-- Remote Contour inside icon -->
  <g transform="translate(13 13) scale(0.86)">
    <!-- Signal wave -->
    <path d="M 36 12 Q 50 4 64 12" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="28" y="20" width="44" height="70" rx="16" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Power dot -->
    <circle cx="50" cy="33" r="3.5" fill="#111827"/>
    <!-- D-Pad -->
    <circle cx="50" cy="52" r="10" fill="none" stroke="#111827" stroke-width="5"/>
    <circle cx="50" cy="52" r="2.5" fill="#111827"/>
    <!-- Buttons -->
    <line x1="41" y1="72" x2="41" y2="76" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <line x1="59" y1="72" x2="59" y2="76" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  </g>
</g>

