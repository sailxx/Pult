<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64">
  <rect width="100%" height="100%" fill="#000000"/>
  <!-- Remote Mark on the left -->
  <g transform="translate(10, 4) scale(0.56)">
    <!-- Signal wave -->
    <path d="M 36 12 Q 50 5 64 12" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <!-- Remote body -->
    <rect x="28" y="20" width="44" height="70" rx="16" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Power dot -->
    <circle cx="50" cy="33" r="3.5" fill="#FFFFFF"/>
    <!-- D-Pad -->
    <circle cx="50" cy="52" r="10" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="50" cy="52" r="2.5" fill="#FFFFFF"/>
    <!-- Buttons -->
    <line x1="41" y1="72" x2="41" y2="76" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="59" y1="72" x2="59" y2="76" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Wordmark 'pult' -->
  <text x="76" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">pult</text>
</svg>
