<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Pult">
<style>
.logo{transform-box:fill-box;transform-origin:center;animation:pop 8s linear infinite}
.l{animation:rise 8s linear infinite;opacity:0}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}9%{transform:none;opacity:1}90%{transform:none;opacity:1}96%,100%{transform:scale(.6);opacity:0}}
@keyframes rise{0%{transform:translateY(34px);opacity:0;animation-timing-function:cubic-bezier(.2,.9,.3,1)}8%{transform:none;opacity:1}90%{transform:none;opacity:1}96%,100%{transform:translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.logo,.l{animation:none;opacity:1}}
</style>

<!-- Perfectly Aligned Icon (Sticky Translate Anchor) -->
<g transform="translate(330 82)">
  <g class="logo">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#0D0F14" stroke="#262C38" stroke-width="2"/>
    <!-- Minimalist Remote Glyph -->
    <path d="M 36 14 Q 48 7 60 14" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <rect x="29" y="21" width="38" height="60" rx="14" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="32" r="3" fill="#FFFFFF"/>
    <circle cx="48" cy="48" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="48" cy="48" r="2.2" fill="#FFFFFF"/>
    <line x1="40" y1="65" x2="40" y2="69" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="56" y1="65" x2="56" y2="69" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
</g>

